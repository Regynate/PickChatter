name: Publish

on: [push, pull_request]

jobs:
  build-dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup-msbuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile
        run: dotnet publish -c Release -o publish\PickChatter  -r win-x64 -p:PublishSingleFile=true --self-contained false
      
      - uses: actions/upload-artifact@v4
        with:
          name: PickChatter
          path: publish